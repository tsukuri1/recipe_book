services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ladushki
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ladushki"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ladushki
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ladushki-course-project-secret
    ports:
      - "${BACKEND_PORT:-8082}:8080"

volumes:
  postgres_data:
